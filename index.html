<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fudo Entry コード読取</title>

  <style>
    :root{
      --orange:#ff7a00;
      --green:#4cae22;
      --blue:#0f4c81;
      --red:#bd2c2c;
      --ink:#172033;
    }

    *{
      box-sizing:border-box
    }

    body{
      margin:0;
      background:#f3f6fa;
      color:var(--ink);
      font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;
      text-align:center
    }

    main{
      max-width:720px;
      margin:auto;
      padding:18px
    }

    /* =========================
       Fudo Entry ロゴ
       ========================= */

    .brand{
      margin:0 auto 18px;
      display:flex;
      flex-direction:column;
      align-items:center;
    }

    .logo-mark{
      width:110px;
      height:110px;
      display:block;
    }

    .logo-text{
      margin-top:2px;
      font-size:30px;
      line-height:1;
      font-weight:800;
      font-style:italic;
      letter-spacing:-1.5px;
    }

    .logo-text .fudo{
      color:var(--orange);
    }

    .logo-text .entry{
      color:var(--green);
      margin-left:5px;
    }

    /* =========================
       入退室モード
       ========================= */

    .mode{
      display:flex;
      gap:10px;
      margin-bottom:12px
    }

    .mode button{
      flex:1;
      min-height:56px;
      margin:0
    }

    .mode button.auto{
      background:#fff1e6;
      color:#c45d00
    }

    .mode button.enter{
      background:#dcfce7;
      color:#166534
    }

    .mode button.exit{
      background:#fee2e2;
      color:#991b1b
    }

    .mode button.selected.auto{
      background:var(--orange);
      color:#fff
    }

    .mode button.selected.enter{
      background:var(--green);
      color:#fff
    }

    .mode button.selected.exit{
      background:var(--red);
      color:#fff
    }

    /* =========================
       カメラ
       ========================= */

    .camera{
      position:relative;
      background:#101828;
      border-radius:16px;
      overflow:hidden;
      aspect-ratio:4/3
    }

    video{
      width:100%;
      height:100%;
      object-fit:cover
    }

    .guide{
      position:absolute;
      left:14%;
      right:14%;
      top:25%;
      bottom:25%;
      border:3px solid white;
      border-radius:12px;
      pointer-events:none;
      box-shadow:0 0 0 999px rgb(0 0 0 / .18);
    }

    /* =========================
       ステータス
       ========================= */

    .status{
      margin:14px 0;
      padding:14px;
      border-radius:12px;
      background:#e8eef6;
      font-weight:600;
      min-height:54px
    }

    .status.error{
      background:#fee2e2;
      color:#991b1b
    }

    /* =========================
       ボタン
       ========================= */

    button{
      width:100%;
      min-height:56px;
      border:0;
      border-radius:12px;
      background:var(--orange);
      color:#fff;
      font-size:20px;
      font-weight:700;
      margin-top:10px;
      cursor:pointer;
      touch-action:manipulation;
    }

    #retry{
      background:var(--orange);
    }

    .sub{
      background:#475569
    }

    .hidden{
      display:none
    }

    @media(max-width:480px){
      main{
        padding:14px
      }

      .logo-mark{
        width:100px;
        height:100px
      }

      .logo-text{
        font-size:28px
      }
    }
  </style>
</head>

<main>

       Fudo Entry ロゴ
       ========================= -->

    <svg
      class="logo-mark"
      viewBox="0
