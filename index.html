<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fudo Entry コード読取</title>

  <style>
    :root{
      --orange:#ff7a00;
      --green:#4cae22;
      --blue:#0f4c81;
      --red:#bd2c2c;
      --ink:#172033;
    }

    *{
      box-sizing:border-box
    }

    body{
      margin:0;
      background:#f3f6fa;
      color:var(--ink);
      font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;
      text-align:center
    }

    main{
      max-width:720px;
      margin:auto;
      padding:18px
    }

    /* =========================
       Fudo Entry ロゴ
       ========================= */

    .brand{
      margin:0 auto 18px;
      display:flex;
      flex-direction:column;
      align-items:center;
    }

    .logo-mark{
      width:110px;
      height:110px;
      display:block;
    }

    .logo-text{
      margin-top:2px;
      font-size:30px;
      line-height:1;
      font-weight:800;
      font-style:italic;
      letter-spacing:-1.5px;
    }

    .logo-text .fudo{
      color:var(--orange);
    }

    .logo-text .entry{
      color:var(--green);
      margin-left:5px;
    }

    /* =========================
       入退室モード
       ========================= */

    .mode{
      display:flex;
      gap:10px;
      margin-bottom:12px
    }

    .mode button{
      flex:1;
      min-height:56px;
      margin:0
    }

    .mode button.auto{
      background:#fff1e6;
      color:#c45d00
    }

    .mode button.enter{
      background:#dcfce7;
      color:#166534
    }

    .mode button.exit{
      background:#fee2e2;
      color:#991b1b
    }

    .mode button.admin{
      background:#ede9fe;
      color:#5b21b6
    }

    .mode button.selected.admin{
      background:#6d28d9;
      color:#fff
    }

    .mode button.selected.auto{
      background:var(--orange);
      color:#fff
    }

    .mode button.selected.enter{
      background:var(--green);
      color:#fff
    }

    .mode button.selected.exit{
      background:var(--red);
      color:#fff
    }

    /* =========================
       カメラ
       ========================= */

    .camera{
      position:relative;
      background:#101828;
      border-radius:16px;
      overflow:hidden;
      aspect-ratio:4/3
    }

    video{
      width:100%;
      height:100%;
      object-fit:cover
    }

    .guide{
      position:absolute;
      left:14%;
      right:14%;
      top:25%;
      bottom:25%;
      border:3px solid white;
      border-radius:12px;
      pointer-events:none;
      box-shadow:0 0 0 999px rgb(0 0 0 / .18);
    }

    /* =========================
       ステータス
       ========================= */

    .status{
      margin:14px 0;
      padding:14px;
      border-radius:12px;
      background:#e8eef6;
      font-weight:600;
      min-height:54px
    }

    .status.error{
  background:#fee2e2;
  color:#991b1b
}

.status.success-enter{
  background:#dcfce7;
  color:#166534
}

.status.success-exit{
  background:#fee2e2;
  color:#991b1b
}

    /* =========================
       ボタン
       ========================= */

    button{
      width:100%;
      min-height:56px;
      border:0;
      border-radius:12px;
      background:var(--orange);
      color:#fff;
      font-size:20px;
      font-weight:700;
      margin-top:10px;
      cursor:pointer;
      touch-action:manipulation;
    }

    #retry{
      background:var(--orange);
    }

    .sub{
      background:#475569
    }

    .back-gas{
      background:#475569;
      margin-top:10px;
    }

    .hidden{
      display:none
    }

    @media(max-width:480px){
      main{
        padding:14px
      }

      .logo-mark{
        width:100px;
        height:100px
      }

      .logo-text{
        font-size:28px
      }
    }
  </style>
</head>

<body>

<main>

  <!-- =========================
       Fudo Entry ロゴ
       ========================= -->

  <div class="brand">

    <svg
      class="logo-mark"
      viewBox="0 0 200 200"
      xmlns="http://www.w3.org/2000/svg"
      aria-label="Fudo Entry"
      role="img">

      <!-- オレンジの円弧 -->
      <path
        d="M88 20
           C45 28 17 64 17 105
           C17 148 47 179 89 184"
        fill="none"
        stroke="#ff7a00"
        stroke-width="13"
        stroke-linecap="round"/>

      <!-- 緑の円弧 -->
      <path
        d="M111 20
           C154 27 183 64 183 105
           C183 148 153 179 111 184"
        fill="none"
        stroke="#4cae22"
        stroke-width="13"
        stroke-linecap="round"/>

      <!-- ドア枠 -->
      <path
        d="M103 45
           H151
           V157"
        fill="none"
        stroke="#4cae22"
        stroke-width="12"
        stroke-linecap="square"/>

      <!-- 開いたドア -->
      <path
        d="M66 50
           L126 76
           V171
           L66 150
           Z"
        fill="#ff7a00"/>

      <!-- ドアノブ -->
      <circle
        cx="108"
        cy="117"
        r="7"
        fill="#ffffff"/>
    </svg>

    <div class="logo-text">
      <span class="fudo">Fudo</span>
      <span class="entry">Entry</span>
    </div>

  </div>


  <!-- =========================
       入退室モード
       ========================= -->


  <div class="mode">
    <button
      id="auto"
      class="selected auto"
      type="button">
      自動
    </button>

    <button
      id="enter"
      class="enter"
      type="button">
      入室
    </button>

    <button
      id="exit"
      class="exit"
      type="button">
      退室
    </button>

    <button
      id="admin"
      class="admin"
      type="button">
      管理者
    </button>
  </div>


  <!-- =========================
       カメラ
       ========================= -->

  <div class="camera">
    <video
      id="video"
      muted
      playsinline
      autoplay>
    </video>

    <div class="guide"></div>
  </div>


  <!-- =========================
       ステータス
       ========================= -->

  <div
    id="status"
    class="status">
    カメラを起動しています…
  </div>


  <!-- =========================
       操作ボタン
       ========================= -->

  <button
    id="retry"
    type="button">
    ライブカメラを再起動
  </button>

  <button
    id="photo"
    class="sub"
    type="button">
    カメラで撮影して読み取る
  </button>

  <button
    id="backGas"
    class="back-gas"
    type="button">
    Fudo Entryへ戻る
  </button>

  <input
    id="photoInput"
    class="hidden"
    type="file"
    accept="image/*"
    capture="environment">

</main>


<script src="https://unpkg.com/@zxing/browser@0.1.5/umd/zxing-browser.min.js"></script>

<script>
(() => {

  const video = document.getElementById('video');
  const status = document.getElementById('status');
  const photoInput = document.getElementById('photoInput');

  let stream = null;
  let active = false;
  let detector = null;
  let reader = null;

  let last = '';
  let lastAt = 0;

  let restartTimer = null;
  let action = '自動';

  const formats = [
    'qr_code',
    'code_128',
    'code_39',
    'ean_13',
    'ean_8',
    'upc_a',
    'upc_e',
    'itf',
    'codabar'
  ];

  /* =========================
     メッセージ表示
     ========================= */

  const say = (text, error, resultAction) => {

  status.textContent = text;

  if (error) {
    status.className = 'status error';
    return;
  }

  if (resultAction === '入室') {
    status.className = 'status success-enter';
    return;
  }

  if (resultAction === '退室') {
    status.className = 'status success-exit';
    return;
  }

  status.className = 'status';
};

  /* =========================
     入室・退室モード
     ========================= */

  const setMode = (next, notify) => {

    if (!['自動', '入室', '退室', '管理者'].includes(next)) {
      return;
    }

    action = next;

    document.getElementById('auto').className =
      next === '自動'
        ? 'selected auto'
        : 'auto';

    document.getElementById('enter').className =
      next === '入室'
        ? 'selected enter'
        : 'enter';

    document.getElementById('exit').className =
      next === '退室'
        ? 'selected exit'
        : 'exit';

    document.getElementById('admin').className =
      next === '管理者'
        ? 'selected admin'
        : 'admin';

    if (notify && window.opener) {

      window.opener.postMessage(
        {
          type: 'FUDO_ENTRY_ACTION',
          action: next
        },
        '*'
      );

    }

  };


  document.getElementById('auto').onclick =
    () => setMode('自動', true);

  document.getElementById('enter').onclick =
    () => setMode('入室', true);

  document.getElementById('exit').onclick =
    () => setMode('退室', true);

  document.getElementById('admin').onclick =
    () => setMode('管理者', true);


  /* =========================
     ボタン
     ========================= */

  document.getElementById('retry').onclick =
    start;

  document.getElementById('photo').onclick =
    () => photoInput.click();

  photoInput.onchange =
    readPhoto;

 document.getElementById('backGas').onclick = () => {

  stop();

  if (window.opener && !window.opener.closed) {

    // GASのFudo Entry画面を前面にする
    window.opener.focus();

    // 少し待ってから、この読取画面を閉じる
    setTimeout(() => {
      window.close();
    }, 100);

  } else {

    say(
      'Fudo Entry画面を確認できません。元の画面からもう一度読取画面を開いてください。',
      true
    );

  }

};

  /* =========================
     親画面へ準備完了を通知
     ========================= */

  if (window.opener) {

    window.opener.postMessage(
      {
        type: 'FUDO_ENTRY_READY'
      },
      '*'
    );

  }



  /* =========================
     映像メタデータ待ち
     ========================= */

  const waitMeta = () => {

    return new Promise((resolve, reject) => {

      // すでに映像情報が取得できている場合
      if (
        video.readyState >= 1 &&
        video.videoWidth > 0
      ) {

        resolve();
        return;

      }


      const timer = setTimeout(() => {

        video.onloadedmetadata = null;

        reject(
          new Error(
            '映像の開始がタイムアウトしました'
          )
        );

      }, 10000);


      video.onloadedmetadata = () => {

        clearTimeout(timer);

        resolve();

      };

    });

  };

  /* =========================
     カメラ起動
     ========================= */

  async function start() {

    // 既存のカメラを停止
    stop();

    say('カメラを起動しています…');

    let lastError = null;


    /*
     * まず前面カメラを試す
     * exact を使わず、対応できる端末を増やす
     */
    const constraintsList = [

      {
        video: {
          facingMode: 'user',
          width: {
            ideal: 1280
          },
          height: {
            ideal: 720
          }
        },
        audio: false
      },

      /*
       * 前面指定が使えない場合のフォールバック
       */
      {
        video: true,
        audio: false
      }

    ];


    for (const constraints of constraintsList) {

      try {

        say('カメラへのアクセスを確認しています…');


        /*
         * getUserMedia が永久に待たないように
         * 15秒でタイムアウト
         */
        const mediaPromise =
          navigator.mediaDevices.getUserMedia(
            constraints
          );

        const timeoutPromise =
          new Promise((_, reject) => {

            setTimeout(() => {

              reject(
                new Error(
                  'カメラ起動がタイムアウトしました'
                )
              );

            }, 15000);

          });


        stream =
          await Promise.race([
            mediaPromise,
            timeoutPromise
          ]);


        /*
         * カメラ取得成功
         */
        if (stream) {
          break;
        }


      } catch (e) {

        lastError = e;

        stop();

      }

    }


    /*
     * カメラを取得できなかった
     */
    if (!stream) {

      const name =
        lastError &&
        lastError.name;


      if (name === 'NotAllowedError') {

        say(
          'カメラの使用が許可されていません。Chromeのサイト設定でカメラを許可してから、「ライブカメラを再起動」を押してください。',
          true
        );

      } else if (name === 'NotFoundError') {

        say(
          'カメラが見つかりません。カメラが接続されているか確認してください。',
          true
        );

      } else if (name === 'NotReadableError') {

        say(
          'カメラを使用できません。ほかのアプリがカメラを使用していないか確認してください。',
          true
        );

      } else if (
        lastError &&
        lastError.message ===
        'カメラ起動がタイムアウトしました'
      ) {

        say(
          'カメラの起動に時間がかかっています。Chromeを再読み込みして、もう一度お試しください。',
          true
        );

      } else {

        say(
          'カメラを起動できませんでした。ブラウザのカメラ権限を確認してください。',
          true
        );

      }

      return;
    }


    /*
     * 映像をvideoにセット
     */
    video.srcObject = stream;


    /*
     * metadata待ち
     */
    try {

      await waitMeta();

    } catch (e) {

      stop();

      say(
        'カメラ映像を開始できませんでした。もう一度お試しください。',
        true
      );

      return;

    }


    /*
     * video再生
     */
    try {

      await video.play();

    } catch (e) {

      stop();

      say(
        'カメラ映像を再生できませんでした。もう一度お試しください。',
        true
      );

      return;

    }


    /*
     * 映像サイズ確認
     */
    if (
      video.videoWidth < 1 ||
      video.videoHeight < 1
    ) {

      stop();

      say(
        'カメラ映像を取得できませんでした。もう一度お試しください。',
        true
      );

      return;
    }


    /*
     * カメラ起動完了
     */
    active = true;


    /* =========================
       BarcodeDetector
       ========================= */

    if ('BarcodeDetector' in window) {

      try {

        detector =
          new BarcodeDetector({
            formats: formats
          });


        say(
          'コードを枠内にかざしてください。'
        );


        nativeScan();

        return;

      } catch (e) {

        detector = null;

      }

    }


    /* =========================
       ZXing
       ========================= */

    zxingScan();

  }


  /* =========================
     標準BarcodeDetector
     ========================= */

  function nativeScan() {

    if (!active || !detector) {
      return;
    }

    detector
      .detect(video)
      .then(results => {

        if (results.length) {

          handleScan(
            results[0].rawValue
          );

        }

      })
      .catch(() => {})

      .finally(() => {

        if (active) {

          requestAnimationFrame(
            nativeScan
          );

        }

      });

  }


  /* =========================
     ZXing
     ========================= */

  function zxingScan() {

    if (!window.ZXingBrowser) {

      say(
        '読取機能を読み込めません。通信を確認してください。',
        true
      );

      return;

    }

    try {

      reader =
        new ZXingBrowser
          .BrowserMultiFormatReader();

      reader.decodeFromVideoElementContinuously(
        video,
        result => {

          if (result) {

            handleScan(
              result.getText()
            );

          }

        }
      );

      say(
        'コードを枠内にかざしてください。'
      );

    } catch (e) {

      say(
        '読取を開始できませんでした。',
        true
      );

    }

  }


  /* =========================
     読み取り処理
     ========================= */

  function handleScan(id) {

    id = String(id || '').trim();

    const now = Date.now();

    if (!id) {
      return;
    }

    // 同じコードの連続読み取りを防止
    if (
      id === last &&
      now - lastAt < 2500
    ) {
      return;
    }

    last = id;
    lastAt = now;

    // カメラを停止
    stop();

    if (window.opener) {

      // まず「記録しています」を表示
      say(
        action === '管理者'
          ? '管理者コードを読み取りました。認証しています…'
          : '読み取り完了: ' + id + '。記録しています…'
      );

      // 親画面へIDを送信
      window.opener.postMessage(
        action === '管理者'
          ? {
              type: 'FUDO_ENTRY_ADMIN_SCAN',
              id: id
            }
          : {
              type: 'FUDO_ENTRY_SCAN',
              id: id
            },
        '*'
      );

      /*
       * ここではカメラを再起動しない。
       *
       * 親画面から記録結果
       * FUDO_ENTRY_RESULT
       * が返ってきた後に再起動する。
       */

    } else {

      say(
        '読み取りは完了しました。必ずFudo Entry画面の「読取画面を開く」から開いてください。',
        true
      );

    }

  }


  /* =========================
     撮影画像から読み取る
     ========================= */

  async function readPhoto() {

    const file =
      photoInput.files &&
      photoInput.files[0];

    if (!file) {
      return;
    }

    stop();

    say(
      '撮影画像を読み取っています…'
    );

    const image = new Image();

    const url =
      URL.createObjectURL(file);

    try {

      await new Promise(
        (resolve, reject) => {

          image.onload = resolve;
          image.onerror = reject;
          image.src = url;

        }
      );

      const r =
        new ZXingBrowser
          .BrowserMultiFormatReader();

      const result =
        await r.decodeFromImageElement(
          image
        );

      handleScan(
        result.getText()
      );

    } catch (e) {

      say(
        'コードを読み取れませんでした。明るい場所で、コード全体が大きく写るように撮影してください。',
        true
      );

    } finally {

      URL.revokeObjectURL(url);
      photoInput.value = '';

    }

  }


  /* =========================
     カメラ再起動予約
     ========================= */

  function queueRestart(ms) {

    clearTimeout(restartTimer);

    restartTimer = setTimeout(() => {

      restartTimer = null;

      start();

    }, ms);

  }


  /* =========================
     メイン画面からのメッセージ
     ========================= */

  window.addEventListener('message', event => {

    const data = event.data;

    if (!data) {
      return;
    }


    /* =========================
       入室・退室モード
       ========================= */

    if (data.type === 'FUDO_ENTRY_MODE') {

      setMode(
        data.action,
        false
      );

      return;
    }

    /*
     * Fudo Bus管理者認証モード
     * 親のFudo Entry画面から管理者モードを指定できます。
     */
    if (data.type === 'FUDO_ENTRY_ADMIN_MODE') {
      setMode('管理者', false);
      say('管理者用バーコードを枠内にかざしてください。');
      return;
    }


    /* =========================
       記録結果
       ========================= */

    if (data.type === 'FUDO_ENTRY_RESULT') {

      // 再起動予約をキャンセル
      clearTimeout(restartTimer);
      restartTimer = null;

      // 念のためカメラを停止
      stop();

      // 記録結果を表示
      say(
  data.message || '記録が完了しました。',
  !!data.error,
  data.action
);

      /*
       * 「記録しました」の表示を
       * 3秒間維持してからカメラを再起動
       */
      restartTimer = setTimeout(() => {

        restartTimer = null;

        start();

      }, 3000);

      return;
    }

  });


  /* =========================
     初回カメラ起動
     ========================= */

  start();

})();
</script>

</body>
</html>
