<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fudo Entry コード読取</title>
  <style>
    *{box-sizing:border-box} body{margin:0;background:#101828;color:#fff;font-family:system-ui,sans-serif;text-align:center} main{max-width:720px;margin:auto;padding:18px}h1{font-size:25px}.camera{position:relative;background:#000;border-radius:16px;overflow:hidden;aspect-ratio:4/3}video{width:100%;height:100%;object-fit:cover}.guide{position:absolute;left:14%;right:14%;top:25%;bottom:25%;border:3px solid white;border-radius:12px;pointer-events:none}.status{margin:14px 0;padding:14px;border-radius:12px;background:#24324a;font-weight:600;min-height:54px}button{width:100%;min-height:56px;border:0;border-radius:12px;background:#1769aa;color:#fff;font-size:20px;font-weight:700}.error{background:#7f1d1d}
  </style>
</head>
<body><main><h1>Fudo Entry コード読取</h1><div class="camera"><video id="video" muted playsinline autoplay></video><div class="guide"></div></div><div id="status" class="status">カメラを起動しています…</div><button id="retry" type="button">カメラを再起動</button></main>
<script src="https://unpkg.com/@zxing/browser@0.1.5/umd/zxing-browser.min.js"></script>
<script>
(() => { const video=document.getElementById('video'),status=document.getElementById('status'); let stream,active=false,detector,reader,last='',lastAt=0; const formats=['qr_code','code_128','code_39','ean_13','ean_8','upc_a','upc_e','itf','codabar']; const say=(t,e)=>{status.textContent=t;status.className='status'+(e?' error':'')}; const waitMeta=()=>new Promise((ok,no)=>{const t=setTimeout(()=>no(new Error('映像の開始がタイムアウトしました')),5000);video.onloadedmetadata=()=>{clearTimeout(t);ok()}});
document.getElementById('retry').onclick=start; async function start(){stop();say('カメラを起動しています…');let lastError;const choices=[{video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false},{video:true,audio:false}];for(const constraints of choices){try{stream=await navigator.mediaDevices.getUserMedia(constraints);video.srcObject=stream;await waitMeta();await video.play();if(video.videoWidth<1)throw new Error('カメラ映像を受信できません');break}catch(e){lastError=e;stop()}}if(!stream){const name=lastError&&lastError.name;say(name==='NotAllowedError'?'カメラを許可してください。Chromeのサイト設定とAndroidのChrome権限を確認後、「カメラを再起動」を押します。':'カメラ映像を開始できません。カメラアプリ等を終了し、端末を再起動してから試してください。',true);return}active=true;if('BarcodeDetector'in window){try{detector=new BarcodeDetector({formats});say('コードを枠内にかざしてください。');nativeScan();return}catch(e){}}zxingScan()}
function nativeScan(){if(!active)return;detector.detect(video).then(x=>{if(x.length)done(x[0].rawValue)}).catch(()=>{}).finally(()=>requestAnimationFrame(nativeScan))} function zxingScan(){if(!window.ZXingBrowser)return say('読取機能を読み込めません。通信を確認してください。',true);try{reader=new ZXingBrowser.BrowserMultiFormatReader();reader.decodeFromVideoElementContinuously(video,(r)=>{if(r)done(r.getText())});say('コードを枠内にかざしてください。')}catch(e){say('読取を開始できませんでした。',true)}}
function done(id){id=String(id||'').trim();const now=Date.now();if(!id||(id===last&&now-lastAt<2500))return;last=id;lastAt=now;stop();say('読み取り完了: '+id+'。元のFudo Entry画面に戻ってください。');if(window.opener)window.opener.postMessage({type:'FUDO_ENTRY_SCAN',id:id},'*');else say('読み取りは完了しました。必ずFudo Entry画面の「読取画面を開く」から開いてください。',true)} function stop(){active=false;detector=null;if(reader){try{reader.reset()}catch(e){}reader=null}if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}video.srcObject=null} start();})();
</script></body></html>
